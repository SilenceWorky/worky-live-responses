name: Piloto de Sangramento

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-sangramento-piloto.yml"

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar piloto de Sangramento
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("skills.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          group_name = "Vento"
          skill_key = "Lamina_de_Ar_Cortante"

          group = data.get(group_name)
          if not isinstance(group, dict):
              raise SystemExit(f"Grupo não encontrado: {group_name}")

          skill = group.get(skill_key)
          if not isinstance(skill, dict):
              raise SystemExit(f"Habilidade não encontrada: {group_name}:{skill_key}")

          skill["dotType"] = "sangramento"

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print(f"PILOTO_SANGRAMENTO={group_name}:{skill_key}")
          print(f"NOME={skill.get('nome')}")
          print(f"TIPO={skill.get('tipo')}")
          print(f"CUSTO={skill.get('custoMentalidade')}")
          print(f"DANO={skill.get('dano')}")
          print(f"PRECISAO={skill.get('precisao')}")
          print(f"EFEITO={skill.get('efeito')}")
          print(f"DOT_TYPE={skill.get('dotType')}")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- skills.json; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi

          git add skills.json
          git commit -m "Configura piloto de Sangramento"
          git push
