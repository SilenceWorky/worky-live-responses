name: Configurar piloto de Lentidao

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-configura-lentidao.yml"

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar habilidade piloto
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("skills.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          grupo = data.get("Gelo", {})
          candidatos = [
              (key, skill)
              for key, skill in grupo.items()
              if str(skill.get("tipo", "")).strip().lower() == "debuff"
          ]

          if not candidatos:
              raise SystemExit("Nenhuma habilidade Debuff encontrada em Gelo")

          key, skill = candidatos[0]
          skill["debuffType"] = "lentidao"
          skill["debuffStat"] = "speed"
          skill["debuffAmount"] = 20
          skill["debuffDuration"] = 2
          skill["efeito"] = "Reduz temporariamente a Velocidade do alvo, alterando a ordem das ações nos turnos seguintes."

          Path("lentidao-piloto.txt").write_text(
              f"{key}\n{skill['nome']}\n",
              encoding="utf-8"
          )

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Validar JSON
        run: python -m json.tool skills.json >/dev/null

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills.json lentidao-piloto.txt
          git commit -m "Configura piloto de Lentidao" || exit 0
          git push
