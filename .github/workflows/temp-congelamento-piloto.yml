name: Configurar Congelamento piloto

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-congelamento-piloto.yml"

permissions:
  contents: write

jobs:
  update-skill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Lança Glaciar
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("skills.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          skill = data["Gelo"]["Lanca_Glaciar"]
          skill["controlType"] = "congelamento"
          skill["controlDuration"] = 1

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Configura Lança Glaciar como piloto de Congelamento"
          git push
