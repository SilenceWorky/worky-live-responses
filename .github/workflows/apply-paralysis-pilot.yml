name: Apply paralysis pilot

on:
  push:
    paths:
      - .github/workflows/apply-paralysis-pilot.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add paralysis metadata to Raio Instantaneo
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('skills.json')
          s = p.read_text(encoding='utf-8')

          old = '''    "Raio_Instantaneo": {\n      "nome": "Raio Instantâneo",\n      "tipo": "Elemental",\n      "raridade": "Incomum",\n      "elemento": "Eletricidade",\n      "custoMentalidade": 18,\n      "cooldown": 2,\n      "escala": "magicStrength",\n      "dano": 42,\n      "precisao": 100,\n      "efeito": "Ataque elétrico rápido com chance de atordoamento.",\n      "prioridade": 0\n    },'''

          new = '''    "Raio_Instantaneo": {\n      "nome": "Raio Instantâneo",\n      "tipo": "Elemental",\n      "raridade": "Incomum",\n      "elemento": "Eletricidade",\n      "custoMentalidade": 18,\n      "cooldown": 2,\n      "escala": "magicStrength",\n      "dano": 42,\n      "precisao": 100,\n      "efeito": "Ataque elétrico rápido que paralisa brevemente o alvo.",\n      "prioridade": 0,\n      "controlType": "paralisia",\n      "controlDuration": 1\n    },'''

          if old not in s:
              raise SystemExit('Raio Instantaneo esperado nao encontrado')

          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          python3 -m json.tool skills.json > /dev/null

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills.json
          git commit -m "Adiciona Paralisia piloto ao Raio Instantaneo"
          git push
