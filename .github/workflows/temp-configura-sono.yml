name: Configurar piloto de Sono

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-configura-sono.yml"

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar habilidade piloto
        run: |
          python - <<'PY'
          import json
          import unicodedata
          from pathlib import Path

          def norm(value):
              text = unicodedata.normalize("NFD", str(value))
              return "".join(ch for ch in text if unicodedata.category(ch) != "Mn").strip().lower()

          path = Path("skills.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          preferred_groups = ["psiquico", "som", "ilusao"]
          picked = None

          for wanted in preferred_groups:
              group_key = next((key for key in data if norm(key) == wanted), None)
              if group_key is None:
                  continue

              group = data[group_key]
              for key, skill in group.items():
                  if norm(skill.get("tipo", "")) != "debuff":
                      continue
                  if any(skill.get(field) for field in ("controlType", "debuffType", "restrictionType", "dotType")):
                      continue
                  picked = (group_key, key, skill)
                  break

              if picked:
                  break

          if not picked:
              raise SystemExit("Nenhuma habilidade Debuff livre encontrada para piloto de Sono")

          group_key, key, skill = picked
          skill["controlType"] = "sono"
          skill["controlDuration"] = 2
          skill["sleepWakeOnDirectDamage"] = True
          skill["efeito"] = "Adormece o alvo por até 2 ações. Enquanto dorme, perde a ação. Dano direto recebido depois da aplicação acorda o alvo imediatamente."

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          Path("sono-piloto.txt").write_text(
              f"{group_key}:{key}\n{skill['nome']}\n",
              encoding="utf-8"
          )
          PY

      - name: Validar JSON
        run: python -m json.tool skills.json >/dev/null

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills.json sono-piloto.txt
          git commit -m "Configura piloto de Sono" || exit 0
          git push
