name: Corrigir resquicios de Ilusao

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-corrige-ilusao.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir catalogo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("skills.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          illusion = data.get("Ilusão")
          if not illusion:
              raise SystemExit("Grupo Ilusão não encontrado no catálogo")

          changed = 0
          for key, skill in illusion.items():
              if skill.get("elemento") != "Psíquico":
                  skill["elemento"] = "Psíquico"
                  changed += 1

          # Corrige o piloto de Sono: Sono não deve carregar o antigo
          # debuff genérico de Precisão herdado da habilidade escolhida.
          psychic = data.get("Psíquico", {})
          sleep = psychic.get("Quebra_de_Consciencia")
          if not sleep:
              raise SystemExit("Quebra_de_Consciencia não encontrada em Psíquico")

          sleep["controlType"] = "sono"
          sleep["controlDuration"] = 2
          sleep["sleepWakeOnDirectDamage"] = True
          sleep.pop("debuffStat", None)
          sleep.pop("debuffAmount", None)
          sleep.pop("debuffDuration", None)
          sleep["efeito"] = (
              "Adormece o alvo por até 2 ações. Enquanto dorme, perde a ação. "
              "Dano direto recebido depois da aplicação acorda o alvo imediatamente."
          )

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          # Validações semânticas.
          check = json.loads(path.read_text(encoding="utf-8"))
          bad = []
          for group, skills in check.items():
              for key, skill in skills.items():
                  if str(skill.get("elemento", "")).strip().lower() == "ilusão":
                      bad.append(f"{group}:{key}")

          if bad:
              raise SystemExit("Ainda existem skills com elemento Ilusão: " + ", ".join(bad[:10]))

          sleep = check["Psíquico"]["Quebra_de_Consciencia"]
          if sleep.get("controlType") != "sono":
              raise SystemExit("Piloto de Sono perdeu controlType=sono")
          if "debuffStat" in sleep:
              raise SystemExit("Piloto de Sono ainda possui debuffStat")

          print(f"Reclassificadas {changed} skills legadas de Ilusão para Psíquico.")
          print("Quebra de Consciência limpa do debuff de Precisão.")
          PY

      - name: Validar JSON
        run: python -m json.tool skills.json >/dev/null

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills.json
          git commit -m "Corrige Ilusao legada e piloto de Sono" || exit 0
          git push
