name: Fix queimadura catalog

on:
  push:
    paths:
      - ".github/workflows/fix-queimadura-catalog.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir skills.json
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path("skills.json")
          text = path.read_text(encoding="utf-8")

          broken_explosao = '''      "efeito": "Explosão concentrada de calor com dano alto.",
      "prioridade": 0
      "dotType": "queimadura",
    },'''

          fixed_explosao = '''      "efeito": "Explosão concentrada de calor com dano alto.",
      "prioridade": 0
    },'''

          if broken_explosao not in text:
              raise SystemExit("Bloco quebrado de Explosão Térmica não encontrado")

          text = text.replace(broken_explosao, fixed_explosao, 1)

          chama_old = '''      "efeito": "Causa dano de fogo e aplica queimadura leve.",
      "prioridade": 0
    },'''

          chama_new = '''      "efeito": "Causa dano de fogo e aplica queimadura leve.",
      "prioridade": 0,
      "dotType": "queimadura"
    },'''

          if chama_old not in text:
              raise SystemExit("Bloco de Chama Devastadora não encontrado")

          text = text.replace(chama_old, chama_new, 1)

          json.loads(text)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills.json
          git commit -m "Corrige Queimadura piloto na Chama Devastadora"
          git push
