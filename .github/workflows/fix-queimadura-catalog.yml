name: Fix queimadura catalog

on:
  push:
    paths:
      - .github/workflows/fix-queimadura-catalog.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corrigir skills.json e validar JSON
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; import base64,json; p=Path("skills.json"); s=p.read_text(encoding="utf-8"); be=base64.b64decode("ICAgICAgImVmZWl0byI6ICJFeHBsb3PDo28gY29uY2VudHJhZGEgZGUgY2Fsb3IgY29tIGRhbm8gYWx0by4iLAogICAgICAicHJpb3JpZGFkZSI6IDAKICAgICAgImRvdFR5cGUiOiAicXVlaW1hZHVyYSIsCiAgICB9LA==").decode(); fe=base64.b64decode("ICAgICAgImVmZWl0byI6ICJFeHBsb3PDo28gY29uY2VudHJhZGEgZGUgY2Fsb3IgY29tIGRhbm8gYWx0by4iLAogICAgICAicHJpb3JpZGFkZSI6IDAKICAgIH0s").decode(); co=base64.b64decode("ICAgICAgImVmZWl0byI6ICJDYXVzYSBkYW5vIGRlIGZvZ28gZSBhcGxpY2EgcXVlaW1hZHVyYSBsZXZlLiIsCiAgICAgICJwcmlvcmlkYWRlIjogMAogICAgfSw=").decode(); cn=base64.b64decode("ICAgICAgImVmZWl0byI6ICJDYXVzYSBkYW5vIGRlIGZvZ28gZSBhcGxpY2EgcXVlaW1hZHVyYSBsZXZlLiIsCiAgICAgICJwcmlvcmlkYWRlIjogMCwKICAgICAgImRvdFR5cGUiOiAicXVlaW1hZHVyYSIKICAgIH0s").decode(); assert be in s, "Bloco quebrado de Explosao Termica nao encontrado"; s=s.replace(be,fe,1); assert co in s, "Bloco de Chama Devastadora nao encontrado"; s=s.replace(co,cn,1); json.loads(s); p.write_text(s,encoding="utf-8")'

      - name: Commit da correcao
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills.json
          git commit -m "Corrige Queimadura piloto na Chama Devastadora"
          git push
