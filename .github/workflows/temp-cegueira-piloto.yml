name: Piloto de Cegueira

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-cegueira-piloto.yml"

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar piloto de Cegueira
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("skills.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          group_name = "Sombra"
          skill_key = "Veu_Ascendente"

          group = data.get(group_name)
          if not isinstance(group, dict):
              raise SystemExit(f"Grupo não encontrado: {group_name}")

          skill = group.get(skill_key)
          if not isinstance(skill, dict):
              raise SystemExit(f"Habilidade não encontrada: {group_name}:{skill_key}")

          skill["debuffType"] = "cegueira"
          skill["debuffStat"] = "accuracy"
          skill["debuffAmount"] = 20
          skill["debuffDuration"] = 2
          skill["efeito"] = "Cria um véu de sombras que prejudica a visão do alvo e reduz sua Precisão."

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print(f"PILOTO_CEGUEIRA={group_name}:{skill_key}")
          print(f"NOME={skill.get('nome')}")
          print(f"TIPO={skill.get('tipo')}")
          print(f"CUSTO={skill.get('custoMentalidade')}")
          print(f"DANO={skill.get('dano')}")
          print(f"PRECISAO={skill.get('precisao')}")
          print(f"DEBUFF_TYPE={skill.get('debuffType')}")
          print(f"DEBUFF_STAT={skill.get('debuffStat')}")
          print(f"DEBUFF_AMOUNT={skill.get('debuffAmount')}")
          print(f"DEBUFF_DURATION={skill.get('debuffDuration')}")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- skills.json; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi

          git add skills.json
          git commit -m "Configura piloto de Cegueira"
          git push
