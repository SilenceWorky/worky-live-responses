<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Boss Alert Marbion</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    #alert {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      opacity: 0;
      padding: 28px 44px;
      border: 3px solid #ff003c;
      border-radius: 22px;
      background: rgba(10, 0, 20, 0.92);
      color: white;
      text-align: center;
      box-shadow:
        0 0 25px #ff003c,
        0 0 60px #8a00ff;
      transition: all 0.5s ease;
    }

    #alert.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .title {
      font-size: 34px;
      font-weight: 900;
      color: #ff003c;
      text-shadow: 0 0 12px #ff003c;
    }

    .name {
      margin-top: 10px;
      font-size: 42px;
      font-weight: 900;
    }

    .info {
      margin-top: 10px;
      font-size: 24px;
      color: #d8c7ff;
    }
  </style>
</head>

<body>
  <div id="alert">
    <div class="title">🚨 BOSS EMERGIU EM MARBION 👑</div>
    <div class="name" id="bossName">Jean Darwin</div>
    <div class="info" id="bossInfo">Lv.100 | Matéria | HP 3000/3000</div>
  </div>

  <script>
    const API_URL =
      "https://marbion-race-api.wellingsonpl.workers.dev/bossalert?user=overlay";

    const alertBox =
      document.getElementById("alert");

    const bossName =
      document.getElementById("bossName");

    const bossInfo =
      document.getElementById("bossInfo");

    let lastAlertId = null;

function playBossSound() {
  const audioCtx =
    new (window.AudioContext || window.webkitAudioContext)();

  const oscillator =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  oscillator.type = "sawtooth";
  oscillator.frequency.setValueAtTime(90, audioCtx.currentTime);
  oscillator.frequency.exponentialRampToValueAtTime(45, audioCtx.currentTime + 0.8);

  gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.9);

  oscillator.connect(gain);
  gain.connect(audioCtx.destination);

  oscillator.start();
  oscillator.stop(audioCtx.currentTime + 0.9);
}

    async function checkBossAlert() {
      try {
        const response =
  await fetch(API_URL + "&t=" + Date.now(), {
    cache: "no-store"
  });

        const data =
          await response.json();

        if (!data.active || !data.alert) {
          return;
        }

        const alert =
          data.alert;

        if (alert.id === lastAlertId) {
          return;
        }

        lastAlertId = alert.id;

        bossName.textContent =
          alert.name;

        bossInfo.textContent =
          `Lv.${alert.level} | ${alert.element} | HP ${alert.hp}/${alert.maxHp}`;

playBossSound();

        alertBox.classList.add("show");

        setTimeout(() => {
          alertBox.classList.remove("show");
        }, 12000);

      } catch (error) {
        console.error("Erro ao buscar boss alert:", error);
      }
    }

    setInterval(checkBossAlert, 700);
    checkBossAlert();
  </script>
</body>
</html>
